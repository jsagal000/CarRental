    <!-- CSS para botones de SweetAlert2 - Compatible con ocultar botones -->
    <style>
        /* Restaurar estilos que Tailwind elimina SOLO para botones VISIBLES */
        .swal2-actions > button.swal2-styled:not([style*="display: none"]):not([style*="display:none"]) {
            /* Restaurar padding que Tailwind elimina */
            padding: 0.625em 1.1em !important;
            /* Restaurar margin */
            margin: 0.3125em !important;
            /* Texto */
            font-size: 1em !important;
            font-weight: 500 !important;
            color: #fff !important;
            /* Bordes */
            border: 0 !important;
            border-radius: 0.25em !important;
            /* Cursor */
            cursor: pointer !important;
        }

        /* Colores de botones SOLO para los visibles */
        .swal2-actions > button.swal2-confirm:not([style*="display: none"]) {
            background-color: #7066e0 !important;
        }

        .swal2-actions > button.swal2-cancel:not([style*="display: none"]) {
            background-color: #6e7881 !important;
        }

        .swal2-actions > button.swal2-deny:not([style*="display: none"]) {
            background-color: #dc3741 !important;
        }

        /* Hover y Focus SOLO para botones visibles */
        .swal2-actions > button.swal2-styled:not([style*="display: none"]):hover {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)) !important;
        }

        .swal2-actions > button.swal2-styled:not([style*="display: none"]):focus {
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(100, 150, 200, 0.5) !important;
        }

        /* IMPORTANTE: Asegurar que botones ocultos estén realmente ocultos */
        .swal2-actions > button.swal2-cancel[style*="display: none"],
        .swal2-actions > button.swal2-deny[style*="display: none"] {
            display: none !important;
        }
    </style>

    <!-- Carga de Plotly.js para gráficos -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Carga de jsPDF para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Helpers para modales -->
    <script src="js/modal-helpers.js"></script>

    <!-- Configuración de SweetAlert2 -->
    <script>
        window.Swal = Swal;

        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer);
                toast.addEventListener('mouseleave', Swal.resumeTimer);
            }
        });

        window.Toast = Toast;

        // Override MEJORADO de Swal.fire con didOpen
        const originalFire = Swal.fire;
        Swal.fire = function (...args) {
            if (args.length === 1 && typeof args[0] === 'object') {
                const config = args[0];

                // Defaults
                if (config.showCancelButton === undefined) {
                    config.showCancelButton = false;
                }

                if (config.showDenyButton === undefined) {
                    config.showDenyButton = false;
                }

                if (config.showConfirmButton === undefined && !config.showCancelButton && !config.showDenyButton) {
                    config.showConfirmButton = true;
                }

                // Hook didOpen para FORZAR display: none
                const originalDidOpen = config.didOpen;
                config.didOpen = function (popup) {
                    // Forzar ocultar botones con display: none inline
                    if (!config.showCancelButton) {
                        const cancelBtn = popup.querySelector('.swal2-cancel');
                        if (cancelBtn) {
                            cancelBtn.style.display = 'none';
                        }
                    }
                    if (!config.showDenyButton) {
                        const denyBtn = popup.querySelector('.swal2-deny');
                        if (denyBtn) {
                            denyBtn.style.display = 'none';
                        }
                    }

                    // Llamar al didOpen original si existe
                    if (originalDidOpen) {
                        originalDidOpen.call(this, popup);
                    }
                };
            }

            return originalFire.apply(this, args);
        };

        console.log('[SweetAlert2] Override aplicado con didOpen');
    </script>

    <!-- Función de descarga de PDF desde byte array -->
    <script>
        window.downloadFileFromByteArray = async function (fileName, byteArray) {
            try {
                console.log('[JS] downloadFileFromByteArray - fileName:', fileName);
                console.log('[JS] downloadFileFromByteArray - bytes:', byteArray.length);

                const blob = new Blob([byteArray], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;

                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    console.log('[JS] PDF descargado exitosamente');
                }, 100);

            } catch (error) {
                console.error('[JS ERROR]', error);
            }
        };
    </script>

    <!-- Service Worker -->
    <script>navigator.serviceWorker.register('service-worker.js');</script>

    <!-- App.js -->
    <script src="js/app.js"></script>

    <!-- Funciones de impresión y descarga -->
    <script>
        window.printReport = function (htmlContent) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
        };

        window.downloadFile = function (content, fileName, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        };
    </script>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
